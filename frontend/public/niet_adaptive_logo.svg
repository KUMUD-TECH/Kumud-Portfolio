<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="436" height="183" viewBox="0 0 436 183">
  <title>NIET Greater Noida Logo — adaptive text</title>
  <desc>The red NIET emblem remains red. The institutional text uses white with difference blending so it appears white on black and black on white when the SVG is used inline.</desc>
  <image x="0" y="0" width="436" height="183" preserveAspectRatio="none"
         href="data:image/png;base64,"/>
  <image x="0" y="0" width="436" height="183" preserveAspectRatio="none"
         href="data:image/png;base64,"
         style="mix-blend-mode:difference"/>
</svg>
